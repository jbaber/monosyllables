<!DOCTYPE html>
<html>
<head>
<style>
#content {
  font-size: 18vw;
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translateX(-50%) translateY(-50%);
}
.front {
  color: black;
  animation: fadeFront 5s forwards;
}
.vowel {
  color: black;
  animation: fadeVowel 5s forwards;
  animation-delay: 1s;
}
.back {
  color: black;
  animation: fadeBack 5s forwards;
  animation-delay: 2s;
}
@keyframes fadeFront {
  to {
    color: red;
  }
}
@keyframes fadeVowel {
  to {
    color: green;
  }
}
@keyframes fadeBack {
  to {
    color: blue;
  }
}
</style>
</head>
<body>
<div id="content"></div>

<script>
// "Universally recognized" clusters from John Algeo (1978) What Consonant
// Clusters Are Possible, Word, 29:3, 206-224,
// DOI: 10.1080/00437956.1978.11435661
let ONSET_CLUSTERS = ["bl", "br", "dr", "dw", "fl", "fr", "gl", "gr", "kl",
"kr", "kw", "pl", "pr", "sk", "skr", "skw", "sl", "sm", "sn", "sp", "spl",
"spr", "st", "str", "sw", "shr", "tr", "sw", "thr", "thw"];
let CODA_CLUSTERS = ["dz", "ft", "ks", "lb", "lch", "ld", "lf", "lk", "lp", "lt",
"nch", "nd", "nt", "nz", "ps", "pt", "sk", "sp", "st", "kt", "lm", "lv", "mp",
"nj", "nk"];

// Extras from the same paper
ONSET_CLUSTERS = ONSET_CLUSTERS.concat(["bw", "dy", "fy", "gw", "gy",
"ky", "mw", "my", "nw", "ny", "pf", "py", "sf", "shl", "shm", "shn", "shp",
"sht", "shw", "skl", "sky", "smy", "spy", "sw", "vl", "vr", "vy", "zh"]);

CODA_CLUSTERS = CODA_CLUSTERS.concat(["rb", "rch", "rd", "rf", "rg",
"rj", "rk", "rl", "rm", "rn", "rp", "rs", "rsh", "rsht", "rt", "rth", "rv",
"nsk", "nf", "nsh", "pf", "rnst", "rpst", "rzh", "rsk"]);

const ONSET_SINGLETONS = ["b", "d", "f", "g", "h", "j", "k", "l", "m", "n", "p", "r",
"s", "t", "v", "w", "y", "z"];
const CODA_SINGLETONS = ["b", "d", "f", "g", "j", "k", "l", "m", "n", "p", "r", "s",
"t", "v", "z"];

/* Internet thinks there are 20 vowel sounds in English give or take --
 * choosing the ones I personally distinguish */
const VOWELS = {

    /* Short */
    "/i/": ["ee", "ea"], // as in "beet"
    "/ɪ/": ["i"], // as in "bit"
    "/ɛ/": ["e", "eh"], // as in "bet"
    "/æ/": ["a"], // as in "bat"
    "/a/": ["aw", "ough"], // as in "bought"
    "/ʌ/": ["u", "uh"], // as in "but"
    "/ʊ/": ["eu", "e"], // as in "book"
    "/ɑ/": ["ah", "aw"], // as in "barn"
    "/ɔ/": ["oh", "o"], // as in "bore"
    "/oʊ/": ["oa", "oh"], // as in "boat"
    "/u/": ["oo", "ooh"], // as in "boot"

    /* Dipthongs */
    "/eɪ/": ["ay", "ai"], // as in "bake"
    "/aɪ/": ["eye", "i"], // as in "bike"
    "/ɔɪ/": ["oy", "oi"], // as in "boy"
    "/aʊ/": ["ow", "ou"], // as in "bout"
    "/oʊ/": ["owe", "o", "oh"], // as in "bone"
    "/ju/": ["ew", "you"], // as in "cute"

    /* "R controlled" */
    "/ɝ/": ["er", "ir"] // as in "bird"
}
const VOWEL_KEYS = Object.keys(VOWELS);

const FRONTS = ONSET_SINGLETONS.concat(ONSET_CLUSTERS).concat([""]);
const BACKS =  CODA_SINGLETONS.concat(CODA_CLUSTERS).concat([""]);

function v_representation(vowel_key, index) {
  let choices = VOWELS[vowel_key];

  let chosen_index = index;
  if (index == undefined) {
    chosen_index = Math.floor(Math.random() * choices.length);
  }

  return choices[chosen_index];
}

function random_triple() {
  return {
    "front": FRONTS[Math.floor(Math.random() * FRONTS.length)],
    "vowel": v_representation(VOWEL_KEYS[Math.floor(Math.random() * VOWEL_KEYS.length)]),
    "back": BACKS[Math.floor(Math.random() * BACKS.length)]
  };
}

function html_from_triple(triple) {
  let to_return = document.createElement("span");
  let front = document.createElement("span");
  let vowel = document.createElement("span");
  let back = document.createElement("span");

  front.classList.add("front");
  vowel.classList.add("vowel");
  back.classList.add("back");

  front.innerText = triple["front"];
  vowel.innerText = triple["vowel"];
  back.innerText = triple["back"];

  to_return.append(front);
  to_return.append(vowel);
  to_return.append(back);

  return to_return;
}


function update() {
  const triple = random_triple();
  const content = document.querySelector("#content");
  content.replaceChildren();
  content.append(html_from_triple(triple));
  content.style.top = "50%";
  content.style.left = "50%";
  let computed_style = window.getComputedStyle(content);
  last_x = Number(computed_style.left.slice(0, -2));
  last_y = Number(computed_style.top.slice(0, -2));
}


/* Just use mouse events for drag and map touch events to them.  If I ever want
 * two-finger touch events, use ctrl-click or something and map to that.  The
 * only thing that would be left out would be pinch-and spread. */
function touch2Mouse(e) {
  let theTouch = e.changedTouches[0];
  let mouseEv;

  switch(e.type) {
    case "touchstart": mouseEv="mousedown"; break;  
    case "touchend":   mouseEv="mouseup"; break;
    case "touchmove":  mouseEv="mousemove"; break;
    default: return;
  }

  let mouseEvent = new MouseEvent(mouseEv, {
    "screenX": theTouch.screenX,
    "screenY": theTouch.screenY,
    "clientX": theTouch.clientX,
    "clientY": theTouch.clientY,
    "ctrlKey": false,
    "altKey": false,
    "shiftKey": false,
    "metaKey": false,
    "button": 0,
    "relatedTarget": null
  });

  theTouch.target.dispatchEvent(mouseEvent);

  e.preventDefault();
}


function x_zone(delta_x) {
  if (delta_x < 100) {
    return 0;
  }
  if (delta_x < 200) {
    return 1;
  }
  for }


let first_x = undefined;
let first_y = undefined;
let mouse_depressed = false;


function mousedown(e) {
  first_x = e.clientX;
  first_y = e.clientY;
  mouse_depressed = true;
}


function mousemove(e) {
  if (!mouse_depressed) {
    return;
  }

  cur_x = e.clientX;
  cur_y = e.clientY;
  let delta_x = cur_x - first_x;
  let delta_y = cur_y - first_y;

  if (100 < delta_x && delta_x < 400) {
  }

    if (delta_x > 0 && delta_x > FIRST_HORZ_THRESH) {
      console.log("Swiped right");
      last_x = cur_x;
      last_y = cur_y;
      update();
      num_updates += 1;
    }
    else if (delta_x < 0 && -delta_x > FIRST_HORZ_THRESH) {
      console.log("Swiped left");
      last_x = cur_x;
      last_y = cur_y;
      update();
      num_updates += 1;
    }

    else if (delta_y > 0 && delta_y > FIRST_VERT_THRESH) {
      last_x = cur_x;
      last_y = cur_y;
      console.log("Swiped down");
    }
    else if (delta_y < 0 && -delta_y > FIRST_VERT_THRESH) {
      last_x = cur_x;
      last_y = cur_y;
      console.log("Swiped up");
    }
  }
}



function mouseup(e) {

  /* If you haven't moved much, it's a touch */
  const cur_x = e.clientX;
  const cur_y = e.clientY;
  const delta_x = cur_x - last_x;
  const delta_y = cur_y - last_y;
  if (delta_x < FIRST_HORZ_THRESH && delta_y < FIRST_VERT_THRESH) {
    update();
  }

  x_path_len = 0;
  y_path_len = 0;
  num_updates = 0;

  mouse_depressed = false;
}

function startup() {
  update();
  document.addEventListener("touchstart", touch2Mouse, true);
  document.addEventListener("touchmove", touch2Mouse, true);
  document.addEventListener("touchend", touch2Mouse, true);
  document.addEventListener("mousemove", mousemove, true);
  document.addEventListener("mousedown", mousedown, true);
  document.addEventListener("mouseup", mouseup, true);
}

document.addEventListener("DOMContentLoaded", startup);
</script>
</body>
</html>
